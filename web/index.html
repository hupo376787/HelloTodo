<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2564cf"><title>HelloTodo</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head><body><div id="app"><header class="top"><button id="hamburger" title="切换导航">☰</button><img class="app-logo" data-app-logo src="icon.svg" alt=""><strong>HelloTodo</strong><div class="search"><span>⌕</span><input id="search" placeholder="搜索" aria-label="搜索"></div><button id="sync" title="同步">↻</button><button id="settings" title="设置">⚙</button></header><div class="layout"><nav id="sidebar" aria-label="任务清单"></nav><div id="sidebar-resizer" class="pane-resizer" role="separator" aria-orientation="vertical" aria-label="调整左侧菜单栏宽度" aria-controls="sidebar" tabindex="0" hidden></div><main id="main"><div id="heading"></div><div id="tasks"></div><form id="add"><span>＋</span><input id="newTask" placeholder="添加任务" autocomplete="off" required><button type="submit">添加</button></form></main><div id="detail-resizer" class="pane-resizer" role="separator" aria-orientation="vertical" aria-label="调整右侧任务详情宽度" aria-controls="detail" tabindex="0" hidden></div><aside id="detail" hidden></aside></div><footer id="status" aria-live="polite">本地模式</footer></div><dialog id="dialog"></dialog><input type="file" id="restore" accept=".json,application/json" hidden><script type="module" src="app.mjs"></script></body></html>
