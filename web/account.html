<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>登录 HelloTodo</title><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"></head>
<body class="account-page"><main class="account-card"><img data-app-logo src="icon.svg" width="56" height="56" alt="HelloTodo"><h1>欢迎使用 HelloTodo</h1><p>登录后，在手机、电脑和网页间同步任务。</p><p id="account-message" role="status" aria-live="polite"></p><div id="account-user" hidden></div><form id="account-form"><label>邮箱<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label>密码<input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="256" placeholder="至少 10 位"></label><button class="primary" type="submit" id="login">登录</button><button type="button" id="register">注册新账号</button></form><div id="account-providers" class="account-providers"></div><div id="account-device" hidden></div><a id="account-continue" href="index.html">暂不登录，使用本地模式</a></main><script type="module" src="account.mjs"></script></body></html>
